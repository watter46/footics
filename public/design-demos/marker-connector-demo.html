<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Footics - 3D Tactical Marker & Connector Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    header {
      padding: 12px 24px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 9999px;
    }
    .controls {
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 13px;
    }
    .control-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="range"] {
      accent-color: #38bdf8;
      cursor: pointer;
    }
    .canvas-container {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 50%, #0a0e17 0%, #000000 100%);
    }
    canvas {
      display: block;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    .instructions {
      position: absolute;
      bottom: 20px;
      left: 24px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 12px;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.05);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="title">
      <span>3D Tactical Ring Marker & Polygonal Connector</span>
      <span class="badge">Exact Match Demo</span>
    </div>
    <div class="controls">
      <div class="control-item">
        <label for="colorTheme">カラー:</label>
        <select id="colorTheme" style="background:#1e293b; color:#fff; border:1px solid #334155; padding:3px 8px; border-radius:4px;">
          <option value="white">リファレンス完全再現 (Solid White Glow)</option>
          <option value="cyan">サイアン発光 (Tactical Cyan)</option>
          <option value="gold">アンバーゴールド (Tactical Gold)</option>
        </select>
      </div>
      <div class="control-item">
        <label for="glowIntensity">発光幅 (Blur):</label>
        <input type="range" id="glowIntensity" min="4" max="50" value="50">
      </div>
      <div class="control-item">
        <label for="glowOpacity">発光透明度 (Opacity):</label>
        <input type="range" id="glowOpacity" min="0.1" max="1.0" step="0.05" value="1.0">
      </div>
    </div>
  </header>

  <div class="canvas-container">
    <canvas id="tacticalCanvas"></canvas>
    <div class="instructions">
      💡 マーカーをドラッグして位置を移動できます。立体リングとコネクタ・面がリアルタイムに連動します。
    </div>
  </div>

  <script>
    const canvas = document.getElementById('tacticalCanvas');
    const ctx = canvas.getContext('2d');

    // リファレンス画像（Chelsea vs Everton）の 4-4-2 / 3-2-4-1 構造をそのまま配置
    // 斜め見下ろしの遠近感を考慮した座標配置
    const defaultMarkers = [
      // Top 頂点 (FW/頂点)
      { id: 1, x: 780, y: 150, number: "9", name: "CF" },
      // 右サイドライン（上から下へ）
      { id: 2, x: 920, y: 220, number: "7", name: "RW" },
      { id: 3, x: 770, y: 350, number: "8", name: "RCM" },
      { id: 4, x: 670, y: 450, number: "4", name: "RB" },
      // 底辺 / センター
      { id: 5, x: 480, y: 640, number: "6", name: "CB" },
      // 左サイドライン（下から上へ）
      { id: 6, x: 190, y: 550, number: "3", name: "LB" },
      { id: 7, x: 380, y: 390, number: "11", name: "LW" },
      { id: 8, x: 530, y: 270, number: "10", name: "LCM" },
      // 内部ユニット（ブロック内の選手2人）
      { id: 9, x: 450, y: 490, number: "5", name: "DM1" },
      { id: 10, x: 460, y: 590, number: "2", name: "DM2" },
    ];

    // 外周ブロックを形成するコネクタのインデックス順 (閉じたポリゴン)
    const perimeterIndices = [0, 1, 2, 3, 4, 5, 6, 7]; // 8角形ループ

    // 内部の接続ライン
    const internalConnections = [
      [7, 8], // LCM -> DM1
      [8, 9], // DM1 -> DM2
      [9, 4], // DM2 -> CB
      [2, 3], // RCM -> RB
      [6, 8], // LW -> DM1
    ];

    let markers = JSON.parse(JSON.stringify(defaultMarkers));
    let draggedMarker = null;
    let dragOffset = { x: 0, y: 0 };

    // 色設定
    const themes = {
      white: {
        glow: 'rgba(255, 255, 255, 0.95)',
        lineGlow: '#ffffff',
        lineCore: '#ffffff',
        edgeStroke: '#ffffff',
        sideRim: 'rgba(255, 255, 255, 0.25)',
        grad1: 'rgba(255, 255, 255, 0.2)',
        grad2: 'rgba(255, 255, 255, 0.65)',
        grad3: 'rgba(255, 255, 255, 0.95)'
      },
      cyan: {
        glow: 'rgba(56, 189, 248, 0.95)',
        lineGlow: '#0284c7',
        lineCore: '#38bdf8',
        edgeStroke: '#38bdf8',
        sideRim: 'rgba(56, 189, 248, 0.3)',
        grad1: 'rgba(56, 189, 248, 0.2)',
        grad2: 'rgba(56, 189, 248, 0.7)',
        grad3: 'rgba(56, 189, 248, 1.0)'
      },
      gold: {
        glow: 'rgba(245, 158, 11, 0.95)',
        lineGlow: '#d97706',
        lineCore: '#fbbf24',
        edgeStroke: '#fbbf24',
        sideRim: 'rgba(251, 191, 36, 0.3)',
        grad1: 'rgba(251, 191, 36, 0.2)',
        grad2: 'rgba(251, 191, 36, 0.7)',
        grad3: 'rgba(251, 191, 36, 1.0)'
      }
    };

    function resizeCanvas() {
      const container = canvas.parentElement;
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      draw();
    }

    window.addEventListener('resize', resizeCanvas);

    // 描画メインループ
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const themeKey = document.getElementById('colorTheme').value;
      const theme = themes[themeKey];
      const glowBlur = parseFloat(document.getElementById('glowIntensity').value);
      const glowOpacity = parseFloat(document.getElementById('glowOpacity').value);

      // 1. 背景の薄いグリッド / ピッチテクスチャ（スケール感の把握用）
      drawPitchBackdrop();

      // 2. コネクタライン（外側へいくにつれて薄くなる多層フォググラデーション）
      drawConnectors(theme, glowBlur, glowOpacity);

      // 3. 各マーカーの「足元の立体多重楕円リング（3D Ring）」を描画（マーカー側も発光幅・発光透明度を適用）
      const sortedMarkers = [...markers].sort((a, b) => a.y - b.y);
      for (const m of sortedMarkers) {
        draw3DRingMarker(m, theme, glowBlur, glowOpacity);
      }
    }

    // ピッチの背景（黒背景に微小なピッチライン）
    function drawPitchBackdrop() {
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      // ピッチの外枠やペナルティエリアのような透視線
      ctx.beginPath();
      ctx.moveTo(100, 100); ctx.lineTo(canvas.width - 100, 100);
      ctx.lineTo(canvas.width - 50, canvas.height - 80);
      ctx.lineTo(50, canvas.height - 80);
      ctx.closePath();
      ctx.stroke();

      // センターサークル楕円
      ctx.beginPath();
      ctx.ellipse(canvas.width / 2, canvas.height / 2, 140, 50, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // 楕円境界との交点を計算（マーカー中心から target への直線が、マーカーの楕円 rx, ry と交差する点）
    function getEllipseIntersection(center, target, rx, ry) {
      const dx = target.x - center.x;
      const dy = target.y - center.y;
      if (dx === 0 && dy === 0) return { x: center.x, y: center.y };
      
      // 楕円方程式: (x/rx)^2 + (y/ry)^2 = 1 に直線 (dx*t, dy*t) を代入
      // t^2 * ((dx/rx)^2 + (dy/ry)^2) = 1
      const val = Math.sqrt((dx * dx) / (rx * rx) + (dy * dy) / (ry * ry));
      if (val === 0) return { x: center.x, y: center.y };
      const t = 1 / val;
      
      return {
        x: center.x + dx * t,
        y: center.y + dy * t
      };
    }

    // コネクタライン（マーカーの外周リム間のみを接続し、外側にいくにつれて薄くなる多層グラデーション）
    function drawConnectors(theme, glowBlur, glowOpacity) {
      // 基準サイズを従来の2倍（2.0x）に拡大: rx: 68, ry: 28
      const rx = 68;
      const ry = 28;

      // 全セグメントのリスト（外周ループ + 内部接続）
      const segments = [];
      for (let i = 0; i < perimeterIndices.length; i++) {
        const fromM = markers[perimeterIndices[i]];
        const toM = markers[perimeterIndices[(i + 1) % perimeterIndices.length]];
        segments.push([fromM, toM]);
      }
      for (const [fromIdx, toIdx] of internalConnections) {
        segments.push([markers[fromIdx], markers[toIdx]]);
      }

      ctx.save();

      // ヘルパー: セグメント一括描画
      function traceSegments() {
        ctx.beginPath();
        for (const [m1, m2] of segments) {
          if (!m1 || !m2) continue;
          const p1 = getEllipseIntersection(m1, m2, rx, ry);
          const p2 = getEllipseIntersection(m2, m1, rx, ry);
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
        }
      }

      // ── 外にいくにつれて薄くなるグラデーション（多層フォグ＋ブラー） ──
      // レイヤA: 最も外側に広がる淡い光彩（超広域フォグ・低不透明度）
      ctx.save();
      ctx.shadowColor = theme.glow;
      ctx.shadowBlur = glowBlur * 1.5;
      ctx.strokeStyle = theme.lineGlow;
      ctx.lineWidth = 14;
      ctx.globalAlpha = glowOpacity * 0.25;
      ctx.lineCap = 'round';
      traceSegments();
      ctx.stroke();
      ctx.restore();

      // レイヤB: 中間グロウ層（滑らかな減衰グラデーション）
      ctx.save();
      ctx.shadowColor = theme.glow;
      ctx.shadowBlur = glowBlur * 0.8;
      ctx.strokeStyle = theme.lineGlow;
      ctx.lineWidth = 7;
      ctx.globalAlpha = glowOpacity * 0.55;
      ctx.lineCap = 'round';
      traceSegments();
      ctx.stroke();
      ctx.restore();

      // レイヤC: コア近傍のシャープなグロウ
      ctx.save();
      ctx.shadowColor = theme.glow;
      ctx.shadowBlur = glowBlur * 0.35;
      ctx.strokeStyle = theme.lineGlow;
      ctx.lineWidth = 4;
      ctx.globalAlpha = glowOpacity * 0.85;
      ctx.lineCap = 'round';
      traceSegments();
      ctx.stroke();
      ctx.restore();

      // ── レイヤD: 中心コアライン（ハイライトの芯） ──
      ctx.save();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = theme.lineCore;
      ctx.lineWidth = 2.2;
      ctx.globalAlpha = 1.0;
      ctx.lineCap = 'round';
      traceSegments();
      ctx.stroke();
      ctx.restore();

      ctx.restore();
    }

    // 足元の3Dリングマーカー本体（外周から中央へフェードアウト・消滅するグラデーション）
    // 基準サイズを従来の2倍（2.0x）: rx: 68, ry: 28
    // マーカー側にも発光幅（glowBlur）と発光透明度（glowOpacity）を適用
    function draw3DRingMarker(m, theme, glowBlur, glowOpacity) {
      const rx = 68; // 外側横半径 (2.0x)
      const ry = 28; // 外側縦半径 (2.0x)
      const ringDepth = 5; // 3Dの厚み

      ctx.save();

      // 1. 3Dシリンダーの側面（厚み部分の下部リム、下側のみに描画）
      ctx.beginPath();
      ctx.ellipse(m.x, m.y + ringDepth, rx, ry, 0, 0, Math.PI, false);
      ctx.lineTo(m.x - rx, m.y);
      ctx.ellipse(m.x, m.y, rx, ry, 0, Math.PI, 0, true);
      ctx.closePath();
      ctx.fillStyle = theme.sideRim;
      ctx.fill();

      // 2. 楕円ディスク（外周が明るく、中央に向かって完全に透明に消滅するラジアルグラデーション）
      // ※黒は一切混ぜず、中央は透明度0で完全に芝生が抜ける
      ctx.save();
      ctx.translate(m.x, m.y);
      ctx.scale(1, ry / rx); // 横 rx, 縦 ry に引き伸ばし

      const radGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
      radGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
      radGrad.addColorStop(0.4, 'rgba(0, 0, 0, 0)');
      radGrad.addColorStop(0.7, theme.grad1);
      radGrad.addColorStop(0.9, theme.grad2);
      radGrad.addColorStop(1.0, theme.grad3);

      ctx.beginPath();
      ctx.arc(0, 0, rx, 0, Math.PI * 2);
      ctx.fillStyle = radGrad;
      ctx.fill();

      ctx.restore();

      // 3. 外周から外側ピッチへの多重ソフトフォグ発光層（コネクタ同様、外にいくにつれて薄くなる多層減衰）
      // 広域フォグ層
      ctx.save();
      ctx.shadowColor = theme.glow;
      ctx.shadowBlur = glowBlur * 1.5;
      ctx.strokeStyle = theme.edgeStroke;
      ctx.lineWidth = 8;
      ctx.globalAlpha = glowOpacity * 0.35;
      ctx.beginPath();
      ctx.ellipse(m.x, m.y, rx, ry, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // 中間フォグ層
      ctx.save();
      ctx.shadowColor = theme.glow;
      ctx.shadowBlur = glowBlur * 0.8;
      ctx.strokeStyle = theme.edgeStroke;
      ctx.lineWidth = 4;
      ctx.globalAlpha = glowOpacity * 0.65;
      ctx.beginPath();
      ctx.ellipse(m.x, m.y, rx, ry, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // 4. 外枠のシャープなストロークエッジ（芯）
      ctx.save();
      ctx.shadowColor = theme.glow;
      ctx.shadowBlur = glowBlur * 0.3;
      ctx.strokeStyle = theme.edgeStroke;
      ctx.lineWidth = 2.4;
      ctx.globalAlpha = 1.0;
      ctx.beginPath();
      ctx.ellipse(m.x, m.y, rx, ry, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      ctx.restore();
    }

    // ドラッグ＆ドロップインタラクション
    function getPointerPos(evt) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (evt.clientX - rect.left),
        y: (evt.clientY - rect.top)
      };
    }

    canvas.addEventListener('mousedown', (e) => {
      const pos = getPointerPos(e);
      // ヒットテスト（2.0x楕円判定: rx=72, ry=32）
      for (let i = markers.length - 1; i >= 0; i--) {
        const m = markers[i];
        const dx = (pos.x - m.x) / 72;
        const dy = (pos.y - m.y) / 32;
        if (dx * dx + dy * dy <= 1) {
          draggedMarker = m;
          dragOffset.x = pos.x - m.x;
          dragOffset.y = pos.y - m.y;
          break;
        }
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (!draggedMarker) return;
      const pos = getPointerPos(e);
      draggedMarker.x = pos.x - dragOffset.x;
      draggedMarker.y = pos.y - dragOffset.y;
      draw();
    });

    window.addEventListener('mouseup', () => {
      draggedMarker = null;
    });

    // コントロール変更イベント
    document.getElementById('colorTheme').addEventListener('change', draw);
    document.getElementById('glowIntensity').addEventListener('input', draw);
    document.getElementById('glowOpacity').addEventListener('input', draw);

    // 初期起動
    resizeCanvas();
  </script>
</body>
</html>
