schema_version = 1

[filters.match-data]
description = "Suppress large match JSON files in public/data"
match_command = "^(rtk\\s+)?(ls|find|read|cat|view_file).*public/data/.*\\.json$"
max_lines = 3
on_empty = "match-data: content suppressed (large file)"

[filters.biome-noise]
description = "Clean up biome lint output"
match_command = "biome\\s+check"
strip_lines_matching = ["^Checked", "^Found", "^Diagnostics not shown"]

[filters.tsc-dedupe]
description = "Deduplicate TSC errors"
match_command = "tsc"
strip_lines_matching = ["node_modules"]
max_lines = 30

[filters.pnpm-list]
description = "Compact pnpm list"
match_command = "pnpm\\s+list"
max_lines = 20
on_empty = "pnpm: dependencies summary shown"

[filters.vitest-filter]
description = "Filter vitest output"
match_command = "vitest"
strip_lines_matching = ["node_modules"]
max_lines = 50
